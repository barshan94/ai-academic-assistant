name: Generate atomic document replacement migration
# One-time helper: remove after the generated migration is committed.

on:
  push:
    branches: [feature/m3-ai-solver]

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, 'generate atomic document replacement migration')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate migration with Supabase CLI
        run: |
          npx --yes supabase@latest migration new atomic_document_page_replacement
          generated=$(find supabase/migrations -maxdepth 1 -type f -name '*_atomic_document_page_replacement.sql' | sort | tail -n 1)
          test -n "$generated"
          cp supabase/migration-drafts/atomic_document_page_replacement.sql "$generated"

      - name: Commit generated migration file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/
          git commit -m "chore: generate atomic document replacement migration"
          git push origin "HEAD:${{ github.ref_name }}"
