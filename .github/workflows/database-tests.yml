name: Database authorization tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Local Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.122.0

      # The repository already contains migrations and pgTAP tests. init adds
      # the missing local config without linking to or modifying a hosted project.
      - name: Initialize local Supabase configuration
        run: |
          supabase init
          # GitHub-hosted runners can already occupy Supabase CLI's default
          # PostgreSQL host port (54322). Use dedicated high ports for the
          # isolated database and shadow database in this job.
          sed -i '/^\[db\]$/,/^\[/ s/^port = 54322$/port = 55432/' supabase/config.toml
          sed -i '/^\[db\]$/,/^\[/ s/^shadow_port = 54320$/shadow_port = 55430/' supabase/config.toml

      - name: Start isolated local database and apply migrations
        run: supabase db start

      - name: Run database authorization tests
        run: supabase test db
