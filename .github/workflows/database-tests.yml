name: Database authorization tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Local Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # The repository already contains migrations and pgTAP tests. init adds
      # the missing local config without linking to or modifying a hosted project.
      - name: Initialize local Supabase configuration
        run: supabase init

      - name: Start isolated local database and apply migrations
        run: supabase db start

      - name: Run database authorization tests
        run: supabase test db
