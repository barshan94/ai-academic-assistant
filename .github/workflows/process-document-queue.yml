name: Process document queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-queue-worker
  cancel-in-progress: false

jobs:
  invoke-worker:
    name: Invoke authenticated document worker
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate scheduler secrets
        env:
          DOCUMENT_WORKER_URL: ${{ secrets.DOCUMENT_WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$DOCUMENT_WORKER_URL" || { echo "::error::Set the DOCUMENT_WORKER_URL Actions secret."; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::Set the CRON_SECRET Actions secret."; exit 1; }
          case "$DOCUMENT_WORKER_URL" in
            https://*) ;;
            *) echo "::error::DOCUMENT_WORKER_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Process one queued document
        env:
          DOCUMENT_WORKER_URL: ${{ secrets.DOCUMENT_WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response="$(curl --silent --show-error --fail-with-body --max-time 70 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${DOCUMENT_WORKER_URL%/}/api/cron/process-documents")"
          echo "$response" >> "$GITHUB_STEP_SUMMARY"
