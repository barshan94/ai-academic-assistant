name: Foundation checks

on:
  push:
    branches: [main, feature/m3-ai-solver]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, unit test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      - name: Validate production environment contract with synthetic fixtures
        # These are deliberately non-secret placeholders. This checks configuration
        # validation only; it does not connect to Supabase, Google or an AI provider.
        run: npm run check:production-env
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: fixture-service-role-key
          GOOGLE_DRIVE_REDIRECT_URI: https://fixture.example.com/api/drive/callback
          GOOGLE_CLIENT_ID: fixture-client-id
          GOOGLE_CLIENT_SECRET: fixture-client-secret
          CRON_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          DRIVE_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AI_API_KEY: fixture-ai-key
          AI_MODEL: fixture-model
          AI_API_BASE_URL: https://api.openai.com/v1

      - name: Audit production dependencies
        # Runtime dependency vulnerabilities are a blocking CI gate.
        # The full development-tree audit below remains a tracked release gate.
        run: npm audit --omit=dev

      - name: Report full dependency audit (tracked release gate)
        # Keep development-toolchain advisories visible without treating them as
        # production runtime exposure. ERR-124 remains open until the lint
        # toolchain can be upgraded without breaking the Next.js ESLint setup.
        continue-on-error: true
        run: npm audit

      - name: Install temporary Playwright types for validation
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Run ESLint
        run: npm run lint

      - name: Type-check application
        run: npm run typecheck

      - name: Type-check Playwright configuration
        run: npx tsc --noEmit --target ES2017 --module esnext --moduleResolution bundler --types node playwright.config.ts

      - name: Type-check authenticated browser acceptance
        run: npx tsc --noEmit --target ES2017 --module esnext --moduleResolution bundler --types node --skipLibCheck playwright.auth.config.ts e2e/authenticated.spec.ts

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build


  authenticated:
    name: Authenticated document and teacher acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      - name: Detect owner acceptance credentials without exposing values
        id: credentials
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
        run: |
          if [[ -n "$NEXT_PUBLIC_SUPABASE_URL" && -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && -n "$E2E_OWNER_EMAIL" && -n "$E2E_OWNER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Owner acceptance credentials are configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Authenticated acceptance skipped: owner credentials are not fully configured."
          fi

      - name: Install Playwright runner and Chromium
        if: steps.credentials.outputs.available == 'true'
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium

      - name: Build application for authenticated acceptance
        if: steps.credentials.outputs.available == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}

      - name: Run authenticated acceptance against isolated E2E accounts
        if: steps.credentials.outputs.available == 'true'
        run: npx playwright test --config=playwright.auth.config.ts
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
          E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}

  browser:
    name: Browser smoke tests (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      - name: Install temporary Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application for browser tests
        run: npm run build

      - name: Run browser tests
        run: npx playwright test
        env:
          CI: "true"
