name: Foundation checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, unit test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Install temporary Playwright types for validation
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Run ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  browser:
    name: Browser smoke tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      - name: Install temporary Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application for browser tests
        run: npm run build

      - name: Run browser tests
        run: npx playwright test
        env:
          CI: "true"
