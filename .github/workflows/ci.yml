name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundation-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm CLI
        run: npm install --global npm@11.21.1

      - name: Install dependencies
        run: npm install


      - name: Upload npm debug log on install failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-debug
          path: /home/runner/.npm/_logs/*.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Commit updated npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: update patched dependency lockfile"
            git push origin HEAD:main
          fi
      - name: Audit dependency tree
        run: npm audit --json > npm-audit.json || true

      - name: Export dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 1
      - name: Run ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
