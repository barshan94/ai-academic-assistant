name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        # Runtime dependency vulnerabilities are a blocking CI gate.
        run: npm audit --omit=dev

      - name: Report full dependency audit (tracked release gate)
        # Keep development-toolchain advisories visible without treating them as
        # production runtime exposure. ERR-124 remains open until the lint
        # toolchain can be upgraded without breaking the Next.js ESLint setup.
        continue-on-error: true
        run: npm audit

      - name: Run ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
