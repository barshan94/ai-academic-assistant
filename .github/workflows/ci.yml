name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, unit test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        # The remaining minimatch advisory is confined to the legacy ESLint dev
        # toolchain. Its v3 API is not compatible with the patched v11 release.
        # The nested typescript-estree dependency is pinned to patched v11.0.3.
        run: npm audit --omit=dev

      - name: Install temporary Playwright types for validation
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Run ESLint
        run: npm run lint

      - name: Type-check application
        run: npm run typecheck

      - name: Type-check Playwright configuration
        run: npx tsc --noEmit --target ES2017 --module esnext --moduleResolution bundler --types node playwright.config.ts

      - name: Type-check authenticated browser acceptance
        run: npx tsc --noEmit --target ES2017 --module esnext --moduleResolution bundler --types node --skipLibCheck playwright.auth.config.ts e2e/authenticated.spec.ts

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  browser:
    name: Browser smoke tests (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      - name: Install temporary Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application for browser tests
        run: npm run build

      - name: Run browser tests
        run: npx playwright test
        env:
          CI: "true"
