name: Generate Supabase migration file
# One-time helper: remove after the migration file is created.

on:
  push:
    branches: [feature/m3-ai-solver]

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, 'generate shared syllabus reference indexes')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate migration with Supabase CLI
        run: npx --yes supabase@latest migration new index_shared_reference_syllabus_foreign_keys

      - name: Commit generated migration file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/
          git commit -m "chore: generate shared syllabus reference migration"
          git push origin "HEAD:${{ github.ref_name }}"
