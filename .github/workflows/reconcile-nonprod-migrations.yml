name: Non-production Supabase migration reconciliation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "IMPORTANT: The default is DRY RUN only. To apply the 44 migrations, select reconcile-and-apply from this dropdown; do not leave the default."
        required: true
        type: choice
        options:
          - reconcile-and-dry-run
          - reconcile-and-apply
        default: reconcile-and-dry-run
      confirmation:
        description: "Required only when operation is reconcile-and-apply. Exact text: APPLY uqpyzicftxxegajaocxi"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: academic-assistant-nonprod-migration
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/feature/m3-ai-solver' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out the approved feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m3-ai-solver
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@a9de0f0e1ffcf6ec895b135e292ddc76592d3c83
        with:
          version: 2.122.0

      - name: Validate secrets and explicit apply confirmation
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: ${name}"
              exit 1
            fi
          done
          if [ "$OPERATION" = "reconcile-and-apply" ]; then
            if [ "$CONFIRMATION" != "APPLY uqpyzicftxxegajaocxi" ]; then
              echo "::error::Apply requires the exact target confirmation phrase."
              exit 1
            fi
            echo "APPLY_PENDING_MIGRATIONS=true" >> "$GITHUB_ENV"
          elif [ "$OPERATION" = "reconcile-and-dry-run" ]; then
            echo "APPLY_PENDING_MIGRATIONS=false" >> "$GITHUB_ENV"
          else
            echo "::error::Unsupported operation."
            exit 1
          fi
          echo "Secrets are present; values are not displayed."

      - name: Reconcile migration history and execute the selected dry-run or apply operation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APPLY_PENDING_MIGRATIONS" = "true" ]; then
            printf '%s\n' "APPLY" | bash scripts/reconcile-nonprod-supabase-migrations.sh
          else
            printf '%s\n' "NO" | bash scripts/reconcile-nonprod-supabase-migrations.sh
          fi
