name: Retired non-production Supabase migration reconciliation

# Intentionally retained as a visible, inert workflow for audit continuity.
# This workflow must not access credentials, link a Supabase project, repair
# migration history, or apply schema changes. Re-enable only after a separately
# reviewed, read-only inventory and explicit owner authorization.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse retired migration operations
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Stop before repository or hosted-resource access
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Migration reconciliation is disabled. No credentials were accessed and no hosted operation was attempted."
          exit 1
