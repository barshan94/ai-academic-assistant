name: Document processing worker

on:
  workflow_dispatch:
    inputs:
      confirm_nonprod_worker_run:
        description: "Confirm one document-processing request against the approved non-production Preview."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: document-processing-worker
  cancel-in-progress: false

jobs:
  process-one-document:
    # Require a deliberate confirmation as well as the exact feature branch.
    # Never let this credentialed job run from an arbitrary dispatch ref.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/m3-ai-solver' && inputs.confirm_nonprod_worker_run == true }}
    name: Process at most one non-production document
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate worker configuration
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_BASE_URL" || { echo "::error::APP_BASE_URL secret is missing"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::CRON_SECRET secret is missing"; exit 1; }
          [ "${#CRON_SECRET}" -ge 32 ] || { echo "::error::CRON_SECRET must contain at least 32 characters"; exit 1; }
          # This job sends CRON_SECRET to APP_BASE_URL. Pin it to the
          # verified stable alias for this feature branch, not an arbitrary
          # deployment hostname, Production URL, or unrelated HTTPS origin.
          if [[ "$APP_BASE_URL" != "https://ai-academic-assistant-git-feature-m3-ai-solver-barshan-s-team.vercel.app" ]]; then
            echo "::error::APP_BASE_URL must equal the verified feature-branch Preview origin"
            exit 1
          fi

      - name: Invoke worker with bounded sanitized response handling
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/invoke-document-worker.mjs
