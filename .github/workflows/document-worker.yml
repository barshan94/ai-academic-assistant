name: Document processing worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-processing-worker
  cancel-in-progress: false

jobs:
  process-one-document:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate worker configuration
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_BASE_URL" || { echo "::error::APP_BASE_URL secret is missing"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::CRON_SECRET secret is missing"; exit 1; }
          case "$APP_BASE_URL" in
            https://*) ;;
            *) echo "::error::APP_BASE_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Process one queued document
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            --max-time 65 \
            --retry 1 --retry-delay 5 --retry-all-errors \
            "${APP_BASE_URL%/}/api/cron/process-documents")"
          cat "$response_file"
          rm -f "$response_file"
          case "$status" in
            2*) ;;
            *) echo "::error::Document worker returned HTTP $status"; exit 1 ;;
          esac
